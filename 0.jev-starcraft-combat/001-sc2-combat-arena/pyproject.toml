[project]
name = "sc2-combat-arena"
version = "0.1.0"
description = "Jev (TypeSafe System One model) controls a Marine squad vs Banelings in StarCraft II."
requires-python = ">=3.12"
dependencies = [
    "burnysc2==7.3.0",
    "typesafe-sdk==0.7.2",
    "python-dotenv==1.2.3",
    "pillow==12.3.0",
    "matplotlib==3.11.2",
    "numpy==2.5.3",
    "soundcard==0.4.6",
]

[project.scripts]
arena = "arena.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arena"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["sc2: launches StarCraft II; run by hand with `-m sc2`"]
addopts = "-m 'not sc2'"
